<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>사주쇼핑 초대</title>
  <meta name="description" content="사주쇼핑에서 친구가 초대했어요. 서로에게 부족한 기운을 채워 줄 선물을 골라 보세요.">
  <meta property="og:title" content="사주쇼핑 초대">
  <meta property="og:description" content="서로에게 부족한 기운을 채워 줄 선물을 골라 보세요.">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161512" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="../"><img src="../assets/favicon.png" alt="">사주쇼핑</a>
      <nav><a href="../support.html">문의</a></nav>
    </div>
  </header>

  <main class="invite">
    <div class="invite-card">
      <div class="seal" id="orb" aria-hidden="true">氣</div>
      <h1 id="title">사주쇼핑에 초대받았어요</h1>
      <p id="message">사주쇼핑에서 내 사주에 부족한 기운을 알아보고, 서로에게 어울리는 선물을 골라 보세요.</p>
      <div class="actions">
        <a class="btn btn-ink" id="open-app" href="sajushopping://invite">앱에서 열기</a>
        <span class="btn btn-line" role="link" aria-disabled="true">App Store <small>출시 예정</small></span>
      </div>
      <p class="fine">앱이 설치돼 있으면 "앱에서 열기"를 누르세요. 친구 정보가 채워진 채로 선물하기가 열려요.</p>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <p class="disclosure">사주쇼핑은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
      <div class="links"><a href="../">홈</a><a href="../privacy.html">개인정보처리방침</a></div>
    </div>
  </footer>

  <script>
    (function () {
      var ELEMENTS = {
        "목": { label: "목(木)", hanja: "木", color: "var(--wood)" },
        "화": { label: "화(火)", hanja: "火", color: "var(--fire)" },
        "토": { label: "토(土)", hanja: "土", color: "var(--earth)" },
        "금": { label: "금(金)", hanja: "金", color: "var(--metal)" },
        "수": { label: "수(水)", hanja: "水", color: "var(--water)" }
      };
      var ALIASES = { "木": "목", "火": "화", "土": "토", "金": "금", "水": "수",
                      wood: "목", fire: "화", earth: "토", metal: "금", water: "수" };

      var params = new URLSearchParams(window.location.search);
      var from = (params.get("from") || "").trim().slice(0, 20);
      var lackRaw = (params.get("lack") || "").trim();
      var lackKey = ELEMENTS[lackRaw] ? lackRaw : ALIASES[lackRaw.toLowerCase()] || ALIASES[lackRaw];
      var lack = lackKey ? ELEMENTS[lackKey] : null;

      // 앱으로 넘길 링크: 알려진 값만 다시 담는다.
      var appParams = new URLSearchParams();
      if (from) appParams.set("from", from);
      if (lackKey) appParams.set("lack", lackKey);
      var query = appParams.toString();
      document.getElementById("open-app").href = "sajushopping://invite" + (query ? "?" + query : "");

      var title = document.getElementById("title");
      var message = document.getElementById("message");
      var orb = document.getElementById("orb");

      if (from) {
        title.textContent = from + "님이 사주쇼핑에 초대했어요";
        document.title = from + "님의 초대 — 사주쇼핑";
      }
      if (lack) {
        orb.textContent = lack.hanja;
        orb.style.background = lack.color;
        message.textContent = (from ? from + "님에게는 " : "") + lack.label +
          " 기운이 필요해요. 사주쇼핑 앱에서 내 사주도 보고, " +
          (from ? from + "님에게" : "서로에게") + " 어울리는 선물도 골라 보세요.";
      }
    })();
  </script>
</body>
</html>
